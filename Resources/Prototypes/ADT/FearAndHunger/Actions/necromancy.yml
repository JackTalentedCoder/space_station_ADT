- type: entity
  parent: BaseAction
  id: ADTActionNecromancy
  name: ручное воскрешение
  description: Выбери рукой того, кого следует воскресить.
  components:
  - type: Action
    useDelay: 8
    icon:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: ratKingArmy
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:NecromancerRaiseMinionActionEvent
    canTargetSelf: false
    whitelist: { components: [ NecromancyAvailable ] }

- type: entity
  parent: BaseAction
  id: ADTActionNecromancyRadius
  name: воскресить по радиусу
  description: Воскреси всех гулей по радиусу, чтобы набрать себе армию!
  components:
  - type: Action
    useDelay: 6
    icon:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: ratKingDomain
  - type: InstantAction
    event: !type:NecromancerRaiseDeadActionEvent

- type: entity
  parent: BaseAction
  id: ADTActionNecromancyOrderStay
  name: Стоять!
  description: Прикажи своей армии стоять на месте.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: stayOff
    iconOn:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: stay
    priority: 5
  - type: InstantAction
    event: !type:NecromancerOrderActionEvent
      type: Stay

- type: entity
  parent: BaseAction
  id: ADTActionNecromancyOrderFollow
  name: За мной!
  description: Прикажи своей армии следовать за тобой.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: followOff
    iconOn:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: follow
    priority: 6
  - type: InstantAction
    event: !type:NecromancerOrderActionEvent
      type: Follow

- type: entity
  parent: BaseAction
  id: ADTActionNecromancyOrderAttack
  name: В атаку!
  description: Прикажи своей армии атаковать цель, на которую тыкнешь.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: attackOff
    iconOn:
      sprite: Interface/Actions/actions_rat_king.rsi
      state: attack
    priority: 7
  - type: InstantAction
    event: !type:NecromancerOrderActionEvent
      type: Attack
